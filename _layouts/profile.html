<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title != site.name %}{{ page.title | escape }} — {% endif %}{{ site.name | escape }}</title>
<meta name="description" content="Shiming Yu — Postdoctoral Fellow at The Hong Kong Polytechnic University. Research in AI, wireless systems, IoT, and NextG mobile networks.">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }} — PolyU">
<meta property="og:description" content="AI, wireless systems, and network infrastructure.">
<meta property="og:image" content="{{ '/images/photo-denver.jpeg' | absolute_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ '/assets/images/monogram.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
<script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="header-inner"><a class="wordmark" href="{{ '/' | relative_url }}">SY<span> / </span><span class="wordmark-name">Shiming Yu</span></a><nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#research">Research</a><a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a><a href="{{ '/talks/' | relative_url }}" {% if page.url == '/talks/' %}aria-current="page"{% endif %}>Talks</a><a href="{{ '/' | relative_url }}#contact">Contact ↗</a></nav></div></header>
<main id="main" class="site-main {% if page.url == '/talks/' %}talks-page{% endif %}">{{ content }}</main>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} Shiming Yu</span><span>AI · Wireless · Networks</span><a href="#main">Back to top ↑</a></footer>
</body>
</html>
